<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-type="module" data-presets="react,typescript">
    import React, { useEffect, useLayoutEffect, useRef, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { ArrowLeft, Menu, X } from 'lucide-react';

    const NAV_LINKS = ['About Us', 'Programs', 'Reviews', 'FAQ', 'Contacts'];

    const VIDEO_SRC =
      'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_234424_b1332b69-2e69-4302-8dbc-40f86846afbd.mp4';

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [scaleY, setScaleY] = useState(1);
      const textRef = useRef(null);

      /* ---------- measure the "404" text and derive the vertical scale ---------- */
      useLayoutEffect(() => {
        const measure = () => {
          const el = textRef.current;
          if (!el) return;
          const h = el.offsetHeight;
          if (!h) return;
          setScaleY((window.innerHeight / h) * 1.4);
        };

        measure();

        // re-measure once webfonts have settled
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(measure).catch(() => {});
        }

        window.addEventListener('resize', measure);
        return () => window.removeEventListener('resize', measure);
      }, []);

      /* ---------- lock body scroll while the menu is open ---------- */
      useEffect(() => {
        document.body.style.overflow = menuOpen ? 'hidden' : '';
        return () => {
          document.body.style.overflow = '';
        };
      }, [menuOpen]);

      return (
        <div
          className="w-full h-screen overflow-hidden flex flex-col relative"
          style={{ background: 'linear-gradient(to bottom, #FF8233 0%, #FDAC55 100%)' }}
        >
          {/* ================= BACKGROUND "404" + OVAL ================= */}
          <div
            className="absolute inset-0 pointer-events-none"
            style={{
              opacity: 0.8,
              maskImage: 'linear-gradient(to bottom, black 40%, transparent 95%)',
              WebkitMaskImage: 'linear-gradient(to bottom, black 40%, transparent 95%)',
            }}
          >
            <div className="absolute inset-0 flex items-center justify-center">
              <div className="relative flex items-center justify-center">
                {/* giant 404 */}
                <div
                  ref={textRef}
                  className="text-white font-black leading-none tracking-tighter whitespace-nowrap select-none"
                  style={{
                    fontSize: 'clamp(200px, 48vw, 800px)',
                    transform: `scale(1.15, ${scaleY})`,
                    transformOrigin: 'center',
                  }}
                >
                  404
                </div>

                {/* white oval sitting over the text */}
                <div
                  className="absolute left-1/2 top-1/2 rounded-full bg-white h-[22vh] sm:h-[26vh] md:h-[50vh]"
                  style={{
                    width: 'clamp(120px, 20vw, 400px)',
                    transform: `translate(-50%, -50%) scale(1, ${scaleY})`,
                    transformOrigin: 'center',
                  }}
                />
              </div>
            </div>
          </div>

          {/* ================= NAVIGATION ================= */}
          <nav className="relative z-20 flex flex-row items-center justify-between px-4 sm:px-6 md:px-12 py-4 sm:py-5">
            {/* logo */}
            <div className="flex items-center">
              <div className="grid grid-cols-2 gap-0.5">
                <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
                <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
                <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
                <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
              </div>
              <span className="text-white font-bold text-lg sm:text-xl ml-1">TinyTrails</span>
            </div>

            {/* desktop links */}
            <div className="hidden md:flex items-center gap-1">
              {NAV_LINKS.map((link) => (
                <a
                  key={link}
                  href="#"
                  className="px-4 py-1.5 text-sm font-medium rounded-full bg-white hover:opacity-90 transition-colors"
                  style={{ color: '#F16524' }}
                >
                  {link}
                </a>
              ))}
            </div>

            {/* menu button */}
            <button
              type="button"
              onClick={() => setMenuOpen(true)}
              aria-label="Open menu"
              className="flex items-center gap-2 px-4 py-2 sm:px-5 sm:py-2.5 rounded-full text-white hover:opacity-90 transition-colors"
              style={{ backgroundColor: '#F16524' }}
            >
              <Menu className="w-4 h-4" />
              <span className="text-sm font-medium hidden sm:inline">Menu</span>
            </button>
          </nav>

          {/* ================= MOBILE MENU OVERLAY ================= */}
          <div
            className={`fixed inset-0 z-50 transition-[visibility] duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${
              menuOpen ? 'visible' : 'invisible'
            }`}
          >
            {/* backdrop */}
            <div
              onClick={() => setMenuOpen(false)}
              className={`absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity duration-500 ${
                menuOpen ? 'opacity-100' : 'opacity-0'
              }`}
            />

            {/* sliding panel */}
            <div
              className={`absolute top-0 right-0 h-full w-full sm:w-[380px] flex flex-col transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                menuOpen ? 'translate-x-0' : 'translate-x-full'
              }`}
              style={{ background: 'linear-gradient(135deg, #FF6B1A 0%, #FF9642 100%)' }}
            >
              {/* panel header */}
              <div className="flex items-center justify-between px-6 py-5">
                <div className="flex items-center">
                  <div className="grid grid-cols-2 gap-0.5">
                    <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
                    <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
                    <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
                    <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full" />
                  </div>
                  <span className="text-white font-bold text-lg sm:text-xl ml-1">TinyTrails</span>
                </div>

                <button
                  type="button"
                  onClick={() => setMenuOpen(false)}
                  aria-label="Close menu"
                  className="w-10 h-10 rounded-full bg-white/20 text-white hover:bg-white/30 transition-colors flex items-center justify-center"
                >
                  <X className="w-5 h-5" />
                </button>
              </div>

              {/* menu items */}
              <nav className="flex flex-col gap-3 px-6 pt-4 pb-32">
                {NAV_LINKS.map((item, i) => (
                  <a
                    key={item}
                    href="#"
                    onClick={() => setMenuOpen(false)}
                    className={`px-6 py-4 text-lg font-semibold text-white rounded-2xl bg-white/10 hover:bg-white/20 transition-all duration-300 ${
                      menuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'
                    }`}
                    style={{ transitionDelay: menuOpen ? `${150 + i * 60}ms` : '0ms' }}
                  >
                    {item}
                  </a>
                ))}
              </nav>

              {/* bottom CTA */}
              <div className="absolute bottom-0 left-0 right-0 p-6">
                <a
                  href="/"
                  className={`w-full py-4 rounded-full bg-white font-semibold text-base hover:scale-[1.02] transition-all duration-500 flex items-center justify-center gap-2 ${
                    menuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'
                  }`}
                  style={{
                    color: '#F16524',
                    transitionDelay: menuOpen ? '450ms' : '0ms',
                  }}
                >
                  <ArrowLeft className="w-5 h-5" />
                  Back to Home
                </a>
              </div>
            </div>
          </div>

          {/* ================= CENTER VIDEO ================= */}
          <div
            className="absolute inset-0 flex items-center justify-center pointer-events-none"
            style={{ marginTop: 'calc(-6vh - 40px)' }}
          >
            <div className="w-[120vw] h-[85vh] sm:w-[70vw] sm:h-[70vh] md:w-[62vw] md:h-[78vh]">
              <video
                className="w-full h-full object-contain pointer-events-none mix-blend-darken"
                src={VIDEO_SRC}
                autoPlay
                loop
                muted
                playsInline
              />
            </div>
          </div>

          {/* ================= BOTTOM CONTENT ================= */}
          <div className="relative z-30 mt-auto pb-8 sm:pb-16 flex flex-col items-center text-center px-4">
            <h1 className="text-white text-lg sm:text-xl md:text-2xl font-medium mb-3 sm:mb-4">
              Oops, something went wrong!
            </h1>

            <a
              href="/"
              className="inline-flex items-center gap-2 px-6 py-3 sm:px-8 sm:py-4 rounded-full text-white font-semibold text-sm sm:text-base hover:scale-105 hover:shadow-lg transition-all"
              style={{ backgroundColor: '#F16524' }}
            >
              <ArrowLeft className="w-4 h-4 sm:w-5 sm:h-5" />
              Back to Home
            </a>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
